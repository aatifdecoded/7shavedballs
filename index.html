function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function linkifyHtml(text) {
  const re = /((https?:\/\/|www\.)[^\s<]+)/gi;
  let out = '';
  let lastIndex = 0;
  let match;
  while ((match = re.exec(text))) {
    if (match.index > lastIndex) out += escapeHtml(text.slice(lastIndex, match.index));
    const url = match[0];
    const href = url.startsWith('http') ? url : `https://${url}`;
    out += `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" data-action="noop" class="underline break-all" style="color:var(--accent-text)">${escapeHtml(url)}</a>`;
    lastIndex = match.index + url.length;
  }
  if (lastIndex < text.length) out += escapeHtml(text.slice(lastIndex));
  return out;
}

function formatTime(ts) {
  return new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function formatDateLabel(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  if (sameDay(d, today)) return 'Today';
  if (sameDay(d, yesterday)) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

function groupByDate(messages) {
  const groups = [];
  let current = null;
  messages.forEach((m) => {
    const label = formatDateLabel(m.createdAt);
    if (!current || current.label !== label) {
      current = { label, items: [] };
      groups.push(current);
    }
    current.items.push(m);
  });
  return groups;
}

function friendlyAuthError(err) {
  const code = (err && err.code) || '';
  if (code.includes('email-already-in-use')) return 'An account already exists for that email. Log in instead.';
  if (code.includes('invalid-email')) return 'Enter a valid email.';
  if (code.includes('weak-password')) return 'Password needs at least 6 characters.';
  if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) {
    return "That email or password doesn't match an account.";
  }
  if (code.includes('too-many-requests')) return 'Too many attempts. Try again in a moment.';
  if (code.includes('network-request-failed')) return "Couldn't reach the server. Check your connection.";
  if (code.includes('requires-recent-login')) return 'Log out and back in, then try that again.';
  return 'Something went wrong. Try again.';
}

function playPing() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 720;
    g.gain.value = 0.0001;
    o.connect(g);
    g.connect(ctx.destination);
    const now = ctx.currentTime;
    g.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    o.start(now);
    o.stop(now + 0.3);
    o.onended = () => ctx.close();
  } catch {
    /* ignore */
  }
}

  return `<div class="flex items-center justify-center rounded-full flex-shrink-0 select-none" style="width:${size}px;height:${size}px;background:${bg}" aria-hidden="true">${inner}</div>`;
}

}

            <button type="button" data-action="switch-auth-mode" data-mode="signup" class="flex-1 py-2 text-sm font-medium ssb-btn" style="background:${state.authMode === 'signup' ? 'var(--accent)' : 'transparent'};color:${state.authMode === 'signup' ? 'var(--ink)' : 'var(--ink-soft)'}">Create account</button>

function mountAuth() {
  root.innerHTML = `<div class="${rootClass()}">${authScreenHtml()}</div>`;
}

function updateAuthFeedback() {
  const errEl = document.getElementById('auth-error');
  const noticeEl = document.getElementById('auth-notice');
  const submitBtn = document.getElementById('auth-submit');
  if (errEl) errEl.textContent = state.authError || '';
  if (noticeEl) noticeEl.textContent = state.authNotice || '';
  if (submitBtn) {
    submitBtn.disabled = state.authLoading;
    submitBtn.innerHTML = state.authLoading ? icon('spinner', 16) : (state.authMode === 'login' ? 'Log in' : 'Create account');
  }
}

function switchAuthMode(mode) {
  captureAuthDraft();
  state.authMode = mode;
  state.authError = '';
  state.authNotice = '';
  mountAuth();
}

function togglePasswordVisibility() {
  captureAuthDraft();
  state.authDraft.showPw = !state.authDraft.showPw;
  mountAuth();
}

async function handleAuthSubmit(form) {
  const mode = form.dataset.mode;
  captureAuthDraft();
  const d = state.authDraft;
  if (mode === 'login') await handleLogin((d.email || '').trim(), d.password || '');
  else await handleSignup((d.username || '').trim(), (d.email || '').trim(), d.password || '', d.confirm || '');
}

async function handleLogin(email, password) {
  state.authError = '';
  state.authNotice = '';
  if (!email || !password) { state.authError = 'Enter your email and password.'; updateAuthFeedback(); return; }
  state.authLoading = true;
  updateAuthFeedback();
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    state.authError = friendlyAuthError(err);
  } finally {
    state.authLoading = false;
    updateAuthFeedback();
  }
}

async function handleResetPassword() {
  captureAuthDraft();
  const email = (state.authDraft.email || '').trim();
  state.authError = '';
  state.authNotice = '';
  if (!email) { state.authError = 'Enter your email above first, then tap this again.'; updateAuthFeedback(); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    state.authNotice = 'Check your email for a reset link.';
  } catch (err) {
    state.authError = friendlyAuthError(err);
  }
  updateAuthFeedback();
}

async function handleSignup(username, email, password, confirm) {
  state.authError = '';
  state.authNotice = '';
  if (!username || username.length < 3) { state.authError = 'Username needs at least 3 characters.'; updateAuthFeedback(); return; }
  if (!/^[a-zA-Z0-9_]+$/.test(username)) { state.authError = 'Username can only use letters, numbers and underscores.'; updateAuthFeedback(); return; }
  if (!email || !/^\S+@\S+\.\S+$/.test(email)) { state.authError = 'Enter a valid email.'; updateAuthFeedback(); return; }
  if (password.length < 6) { state.authError = 'Password needs at least 6 characters.'; updateAuthFeedback(); return; }
  if (password !== confirm) { state.authError = "Passwords don't match."; updateAuthFeedback(); return; }

  const usernameLower = username.toLowerCase();
  state.authLoading = true;
  updateAuthFeedback();
  let createdUser = null;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    createdUser = cred.user;
    const usernameRef = ref(db, `usernames/${usernameLower}`);
    const txResult = await runTransaction(usernameRef, (current) => {
      if (current === null) return createdUser.uid;
      return; // abort: already taken
    });
    if (!txResult.committed) {
      await deleteUser(createdUser);
      state.authError = 'That username is already taken.';
      return;
    }
    await set(ref(db, `users/${createdUser.uid}`), {
      username,
      bio: '',
      avatarColor: AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)],
      avatarEmoji: '',
      theme: 'light',
      soundEnabled: true,
      createdAt: Date.now(),
    });
    await updateAuthProfile(createdUser, { displayName: username });
  } catch (err) {
    if (createdUser) {
      try { await deleteUser(createdUser); } catch { /* ignore */ }
    }
    state.authError = friendlyAuthError(err);
  } finally {
    state.authLoading = false;
    updateAuthFeedback();
  }
}

async function handleLogout() {
  const myUid = state.uid;
  if (typingClearTimer) clearTimeout(typingClearTimer);
  if (myUid) {
    try { await remove(ref(db, `typing/${myUid}`)); } catch { /* ignore */ }
  }
  state.authMode = 'login';
  state.authError = '';
  state.authNotice = '';
  state.authDraft = {};
  await signOut(auth);
}

function dateSeparatorHtml(label) {

function messageRowHtml(msg, byId) {
  const uid = state.uid;
  const author = state.usersById[msg.uid];
  const displayName = (author && author.username) || msg.username || 'someone';
  const isOwn = msg.uid === uid;
  const readByIds = Object.keys(msg.readBy || {});
  const replyToMsg = msg.replyToId ? byId[msg.replyToId] : null;
  const replyAuthor = replyToMsg ? state.usersById[replyToMsg.uid] : null;

  const replyBlock = replyToMsg ? `
    <button type="button" data-action="scroll-to-message" data-id="${escapeHtml(replyToMsg.id)}" class="mt-1 mb-1 flex items-start gap-1.5 text-left rounded-md px-2 py-1 text-xs max-w-full" style="background:var(--surface);border:1px solid var(--line);color:var(--ink-soft)">
      ${icon('reply', 12)}
      <span class="truncate"><strong style="color:var(--ink)">${escapeHtml((replyAuthor && replyAuthor.username) || replyToMsg.username || 'someone')}</strong>${'  '}${escapeHtml(replyToMsg.text)}</span>
    </button>
  ` : '';

  const reactionsEntries = Object.entries(msg.reactions || {}).filter(([, uids]) => uids && Object.keys(uids).length);
  const reactionsBlock = reactionsEntries.length ? `
    <div class="flex flex-wrap gap-1.5 mt-1.5">
      ${reactionsEntries.map(([emoji, uids]) => {
        const count = Object.keys(uids).length;
        const mine = !!uids[uid];
        return `<button type="button" data-action="react" data-msg-id="${escapeHtml(msg.id)}" data-emoji="${escapeHtml(emoji)}" class="flex items-center gap-1 px-2 py-0.5 rounded-full text-xs" style="border:1px solid var(--line);background:${mine ? 'var(--accent-soft)' : 'var(--surface)'}"><span>${emoji}</span><span style="color:var(--ink-soft)">${count}</span></button>`;
      }).join('')}
    </div>
  ` : '';

  const reactionPickerBlock = state.reactionPickerId === msg.id ? `
    <div class="fixed inset-0 z-10" data-action="toggle-reaction-picker" data-id="${escapeHtml(msg.id)}"></div>
    <div class="absolute left-0 bottom-full mb-1 flex gap-1 rounded-full px-2 py-1.5 z-20" style="background:var(--surface);border:1px solid var(--line)">
      ${REACTIONS.map((em) => `<button type="button" data-action="react" data-msg-id="${escapeHtml(msg.id)}" data-emoji="${escapeHtml(em)}" data-close-picker="1" class="text-base hover:scale-110 transition-transform" style="line-height:1">${em}</button>`).join('')}

  ` : '';

  const readPopoverBlock = (state.readPopoverId === msg.id && isOwn) ? `
    <div class="mt-1.5 text-xs rounded-md px-2.5 py-2" style="background:var(--surface);border:1px solid var(--line);color:var(--ink-soft)" data-action="noop">

    </div>

  return `
    <div data-msg-id="${escapeHtml(msg.id)}" data-action="${isOwn ? 'toggle-read-popover' : 'noop'}" data-id="${escapeHtml(msg.id)}" class="ssb-msg-enter group px-4 py-2.5 md:px-6 flex gap-3" style="background:${isOwn ? 'var(--accent-soft)' : 'transparent'};cursor:${isOwn ? 'pointer' : 'default'}">
      ${avatarHtml(displayName, author && author.avatarColor, author && author.avatarEmoji, 34)}
      <div class="flex-1 min-w-0">
        <div class="flex items-baseline gap-2">
          <span class="text-sm font-semibold">${escapeHtml(displayName)}</span>
          <span class="text-xs" style="color:var(--ink-soft)">${formatTime(msg.createdAt)}</span>
        </div>
        ${replyBlock}
        <p class="text-sm mt-0.5 whitespace-pre-wrap break-words">${linkifyHtml(msg.text || '')}</p>
        ${reactionsBlock}
        <div class="flex items-center gap-4 mt-1.5">
          <button type="button" data-action="reply" data-id="${escapeHtml(msg.id)}" class="flex items-center gap-1 text-xs" style="color:var(--ink-soft)">${icon('reply', 13)} Reply</button>
          <div class="relative">
            <button type="button" data-action="toggle-reaction-picker" data-id="${escapeHtml(msg.id)}" class="flex items-center gap-1 text-xs" style="color:var(--ink-soft)">${icon('smile', 13)} React</button>
            ${reactionPickerBlock}
          </div>
          ${isOwn ? `<span class="flex items-center gap-1 text-xs" style="color:var(--ink-soft)">${icon('eye', 13)} ${readByIds.length ? `Seen by ${readByIds.length}` : 'Sent'}</span>` : ''}
        </div>

function renderMessageList() {
  const listEl = document.getElementById('message-list-inner');
  const olderRowEl = document.getElementById('load-older-row');
  const feedEl = document.getElementById('message-feed');
  if (!listEl || !feedEl || !olderRowEl) return;

  const nearBottomBefore = feedEl.scrollHeight - feedEl.scrollTop - feedEl.clientHeight < 150;
  const isFirstRender = !hasRenderedMessageListOnce;

  olderRowEl.innerHTML = (state.hasMore && state.messages.length > 0) ? `
    <div class="flex justify-center py-2">
      <button type="button" data-action="load-older" class="ssb-btn inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2" style="background:transparent;color:var(--ink);border:1.5px solid var(--line)" ${state.loadingMore ? 'disabled' : ''}>
        ${state.loadingMore ? icon('spinner', 14) : icon('chevronUp', 14)} Load older messages
      </button>
    </div>
  ` : '';

  if (state.messages.length === 0) {
    listEl.innerHTML = `
      <div class="flex flex-col items-center justify-center text-center px-6" style="min-height:60vh">
        <p class="ssb-display font-semibold" style="font-size:1.15rem">No messages yet</p>
        <p class="text-sm mt-1" style="color:var(--ink-soft)">Say hello. The chat is empty until someone starts it.</p>
      </div>
    `;
  } else {
    const byId = {};
    state.messages.forEach((m) => { byId[m.id] = m; });
    const groups = groupByDate(state.messages);
    listEl.innerHTML = groups.map((group) => `
      <div>
        ${dateSeparatorHtml(group.label)}
        ${group.items.map((m) => messageRowHtml(m, byId)).join('')}
      </div>
    `).join('');
  }

  if (msgObserver) msgObserver.disconnect();
  msgObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        const id = entry.target.getAttribute('data-msg-id');
        if (id) queueRead(id);
      }
    });
  }, { root: feedEl, threshold: 0.6 });
  listEl.querySelectorAll('[data-msg-id]').forEach((n) => msgObserver.observe(n));

  if (nearBottomBefore || isFirstRender) {
    requestAnimationFrame(() => {
      const bottomEl = document.getElementById('feed-bottom');
      if (bottomEl) bottomEl.scrollIntoView({ behavior: isFirstRender ? 'auto' : 'smooth' });
    });
  }
  hasRenderedMessageListOnce = true;
}

function updateTypingIndicatorLabel() {
  const el = document.getElementById('typing-label');
  if (!el) return;
  const uid = state.uid;
  const now = Date.now();
  const names = Object.entries(state.typingMap)
    .filter(([u, t]) => u !== uid && t && now - t.ts < 4000)
    .map(([, t]) => t.username);
  let label = '';
  if (names.length === 1) label = `${names[0]} is typing…`;
  else if (names.length === 2) label = `${names[0]} and ${names[1]} are typing…`;
  else if (names.length > 2) label = `${names[0]}, ${names[1]} and ${names.length - 2} more are typing…`;
  el.textContent = label;
}

function updateReplyPreview() {
  const el = document.getElementById('reply-preview');
  if (!el) return;
  if (!state.replyingTo) { el.innerHTML = ''; return; }
  const r = state.replyingTo;
  el.innerHTML = `
    <div class="flex items-center justify-between gap-2 mb-2 rounded-md px-2.5 py-1.5 text-xs" style="background:var(--surface);border:1px solid var(--line)">
      <span class="truncate" style="color:var(--ink-soft)">Replying to <strong style="color:var(--ink)">${escapeHtml(r.username)}</strong>: ${escapeHtml(r.text)}</span>
      <button type="button" data-action="cancel-reply" class="ssb-icon-btn flex-shrink-0" aria-label="Cancel reply">${icon('x', 14)}</button>
    </div>
  `;
}

async function handleTypingActivity() {
  const myUid = state.uid;
  const me = getProfile();
  if (!myUid || !me) return;
  const now = Date.now();
  if (now - lastTypingWrite > 1200) {
    lastTypingWrite = now;
    const typingRef = ref(db, `typing/${myUid}`);
    try {
      await set(typingRef, { username: me.username, ts: now });
      onDisconnect(typingRef).remove();
    } catch { /* ignore */ }
  }
  if (typingClearTimer) clearTimeout(typingClearTimer);
  typingClearTimer = setTimeout(async () => {
    try { await remove(ref(db, `typing/${myUid}`)); } catch { /* ignore */ }
  }, 3000);
}

async function handleSend() {
  const textarea = document.getElementById('composer-textarea');
  if (!textarea) return;
  const text = textarea.value.trim();
  const myUid = state.uid;
  const me = getProfile();
  if (!text || !myUid || !me) return;
  state.sending = true;
  const sendBtn = document.getElementById('composer-send');
  if (sendBtn) { sendBtn.disabled = true; sendBtn.innerHTML = icon('spinner', 16); }
  try {
    const newRef = push(ref(db, 'messages'));
    await set(newRef, {
      uid: myUid,
      username: me.username,
      text,
      createdAt: Date.now(),
      replyToId: state.replyingTo ? state.replyingTo.id : null,
      reactions: {},
      readBy: {},
    });
    textarea.value = '';
    state.draftText = '';
    state.replyingTo = null;
    updateReplyPreview();
    if (typingClearTimer) clearTimeout(typingClearTimer);
    await remove(ref(db, `typing/${myUid}`));
  } finally {
    state.sending = false;
    if (sendBtn) {
      sendBtn.innerHTML = icon('send', 16);
      const t = document.getElementById('composer-textarea');
      sendBtn.disabled = !(t && t.value.trim());
    }
  }
}

async function handleToggleReaction(msgId, emoji) {
  if (!state.uid) return;
  const msg = state.messages.find((m) => m.id === msgId);
  const already = !!(msg && msg.reactions && msg.reactions[emoji] && msg.reactions[emoji][state.uid]);
  const reactionRef = ref(db, `messages/${msgId}/reactions/${emoji}/${state.uid}`);
  try {
    if (already) await remove(reactionRef);
    else await set(reactionRef, true);
  } catch { /* ignore */ }
}

function scrollToMessage(id) {
  const el = document.querySelector(`[data-msg-id="${CSS.escape(id)}"]`);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('ssb-flash');
    setTimeout(() => el.classList.remove('ssb-flash'), 1000);
  }
}

function queueRead(id) {
  pendingReadIds.add(id);
  if (flushReadsTimer) return;
  flushReadsTimer = setTimeout(flushReads, 900);
}

async function flushReads() {
  flushReadsTimer = null;
  const ids = Array.from(pendingReadIds);
  pendingReadIds.clear();
  const myUid = state.uid;
  if (!ids.length || !myUid) return;
  const updates = {};
  ids.forEach((id) => {
    const m = state.messages.find((x) => x.id === id);
    if (m && m.uid !== myUid && !(m.readBy && m.readBy[myUid])) {
      updates[`messages/${id}/readBy/${myUid}`] = true;
    }
  });
  if (Object.keys(updates).length) {
    try { await update(ref(db), updates); } catch { /* ignore */ }
  }
}

async function loadOlderMessages() {
  if (!state.oldestLoaded || state.loadingMore || !state.hasMore) return;
  state.loadingMore = true;
  renderMessageList();
  try {
    const olderQuery = query(ref(db, 'messages'), orderByChild('createdAt'), endBefore(state.oldestLoaded), limitToLast(PAGE_SIZE));
    const snap = await get(olderQuery);
    const val = snap.val() || {};
    const list = Object.entries(val).map(([id, m]) => ({ id, ...m }));
    if (!list.length) {
      state.hasMore = false;
    } else {
      const seen = new Set(state.messages.map((m) => m.id));
      const merged = [...list.filter((m) => !seen.has(m.id)), ...state.messages];
      state.messages = merged.sort((a, b) => a.createdAt - b.createdAt);
      state.oldestLoaded = Math.min(...list.map((m) => m.createdAt));
      if (list.length < PAGE_SIZE) state.hasMore = false;
    }
  } finally {
    state.loadingMore = false;
    renderMessageList();
  }
}

function computeProfileStats(p) {
  const myMessages = state.messages.filter((m) => m.uid === p.uid);
  const reactionsReceived = myMessages.reduce(
    (sum, m) => sum + Object.values(m.reactions || {}).reduce((a, uids) => a + Object.keys(uids || {}).length, 0),
    0
  );
  const daysActive = Math.max(1, Math.ceil((Date.now() - p.createdAt) / 86400000));
  return { count: myMessages.length, reactionsReceived, daysActive };
}

function mountProfile() {

  if (!p) { mountAuth(); return; }
  state.profileEditing = false;
  state.profileEditDraft = null;
  root.innerHTML = `

      <div class="flex flex-1 min-h-0">
        ${sideNavHtml('profile')}
        <main class="flex-1 flex flex-col min-h-0">
          <div id="profile-content" class="flex-1 overflow-y-auto ssb-scroll px-6 py-8"></div>
        </main>
      </div>
      ${bottomNavHtml('profile')}
    </div>
  `;
  renderProfileContent();
}

function renderProfileContent() {
  const p = getProfile();
  const el = document.getElementById('profile-content');
  if (!p || !el) return;
  const stats = computeProfileStats(p);

  if (!state.profileEditing) {
    el.innerHTML = `
      <div class="max-w-md mx-auto">
        <div class="flex flex-col items-center text-center">
          ${avatarHtml(p.username, p.avatarColor, p.avatarEmoji, 84)}
          <h2 class="ssb-display font-semibold mt-3" style="font-size:1.3rem">${escapeHtml(p.username)}</h2>
          <p class="text-sm mt-1" style="color:var(--ink-soft)">${escapeHtml(p.email)}</p>
          <p class="text-sm mt-3 max-w-xs">${escapeHtml(p.bio || 'No bio yet.')}</p>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-6">
          ${statHtml('Messages', stats.count)}
          ${statHtml('Reactions', stats.reactionsReceived)}
          ${statHtml('Days here', stats.daysActive)}
        </div>
        <button type="button" data-action="edit-profile" class="ssb-btn w-full mt-6 inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2" style="background:transparent;color:var(--ink);border:1.5px solid var(--line)">${icon('pencil', 14)} Edit profile</button>
      </div>
    `;
  } else {
    if (!state.profileEditDraft) {
      state.profileEditDraft = { bio: p.bio || '', avatarColor: p.avatarColor, avatarEmoji: p.avatarEmoji };
    }
    const draft = state.profileEditDraft;
    el.innerHTML = `
      <div class="max-w-md mx-auto">
        <div class="flex flex-col items-center text-center">
          <div id="profile-avatar-preview">${avatarHtml(p.username, draft.avatarColor, draft.avatarEmoji, 84)}</div>
          <h2 class="ssb-display font-semibold mt-3" style="font-size:1.3rem">${escapeHtml(p.username)}</h2>
          <p class="text-sm mt-1" style="color:var(--ink-soft)">${escapeHtml(p.email)}</p>
        </div>
        <div class="grid grid-cols-3 gap-2 mt-6">
          ${statHtml('Messages', stats.count)}
          ${statHtml('Reactions', stats.reactionsReceived)}
          ${statHtml('Days here', stats.daysActive)}
        </div>
        <div class="mt-6 flex flex-col gap-4">
          <label class="flex flex-col gap-1.5 text-sm">
            <span style="color:var(--ink-soft)">Bio</span>
            <textarea id="profile-bio-input" maxlength="160" rows="3" class="w-full px-3 py-2 rounded-lg text-sm ssb-input" style="background:var(--surface);border:1.5px solid var(--line);color:var(--ink)">${escapeHtml(draft.bio)}</textarea>
            <span id="profile-bio-counter" class="text-xs" style="color:var(--ink-soft)">${draft.bio.length}/160</span>
          </label>
          <div>
            <p class="text-sm mb-2" style="color:var(--ink-soft)">Avatar color</p>
            <div id="profile-color-picker" class="flex flex-wrap gap-2">${colorPickerHtml(draft.avatarColor)}</div>
          </div>
          <div>
            <p class="text-sm mb-2" style="color:var(--ink-soft)">Avatar icon</p>
            <div id="profile-emoji-picker" class="flex flex-wrap gap-2">${emojiPickerHtml(draft.avatarEmoji)}</div>
          </div>
          <div class="flex gap-2">
            <button type="button" id="profile-save-btn" data-action="save-profile" class="ssb-btn inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2" style="background:var(--accent);color:var(--ink)">${icon('check', 14)} Save changes</button>
            <button type="button" data-action="cancel-edit-profile" class="ssb-btn inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2" style="background:transparent;color:var(--ink-soft)">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }
}

async function persistProfilePatch(patch) {
  const myUid = state.uid;
  if (!myUid) return;
  try { await update(ref(db, `users/${myUid}`), patch); } catch { /* ignore */ }
}

async function saveProfile() {
  const bioEl = document.getElementById('profile-bio-input');
  const btn = document.getElementById('profile-save-btn');
  const bio = (bioEl ? bioEl.value : (state.profileEditDraft.bio || '')).slice(0, 160);
  if (btn) { btn.disabled = true; btn.innerHTML = `${icon('spinner', 14)} Save changes`; }
  await persistProfilePatch({ bio, avatarColor: state.profileEditDraft.avatarColor, avatarEmoji: state.profileEditDraft.avatarEmoji });
  state.profileEditing = false;
  state.profileEditDraft = null;
  renderProfileContent();
}

          <button type="button" data-action="show-legal" data-kind="terms" class="text-left px-4 py-3 text-sm">Terms of service</button>
        </div>

        <button type="button" data-action="logout" class="ssb-btn w-full inline-flex items-center justify-center gap-2 rounded-lg text-sm font-medium px-4 py-2" style="background:transparent;color:var(--danger);border:1.5px solid var(--danger-soft)">${icon('logout', 14)} Log out</button>
        <p class="text-xs text-center" style="color:var(--ink-soft)">Messages, usernames and profiles in this app are visible to anyone signed in.</p>
      </section>
    </div>
  `;
  const pwShow = document.getElementById('pw-show');
  if (pwShow) {
    pwShow.addEventListener('change', () => {
      const t = pwShow.checked ? 'text' : 'password';
      ['pw-current', 'pw-next', 'pw-confirm'].forEach((id) => {
        const e = document.getElementById(id);
        if (e) e.type = t;
      });
    });
  }
}

async function handlePasswordSubmit(form) {
  const current = document.getElementById('pw-current').value;
  const next = document.getElementById('pw-next').value;
  const confirm = document.getElementById('pw-confirm').value;
  const errEl = document.getElementById('pw-error');
  const okEl = document.getElementById('pw-success');
  const btn = document.getElementById('pw-submit');
  errEl.textContent = '';
  okEl.textContent = '';
  if (next.length < 6) { errEl.textContent = 'New password needs at least 6 characters.'; return; }
  if (next !== confirm) { errEl.textContent = "New passwords don't match."; return; }
  btn.disabled = true;
  btn.innerHTML = icon('spinner', 14);
  try {
    const cred = EmailAuthProvider.credential(auth.currentUser.email, current);
    await reauthenticateWithCredential(auth.currentUser, cred);
    await updatePassword(auth.currentUser, next);
    okEl.textContent = 'Password updated.';
    form.reset();
  } catch (err) {
    errEl.textContent = friendlyAuthError(err);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Update password';
  }
}

/* ----------------------------------------------------------------------
   Navigation / top-level mounting
---------------------------------------------------------------------- */

function mountLoading() {
  root.innerHTML = `<div class="ssb-root flex flex-col" style="align-items:center;justify-content:center">${icon('spinner', 22)}</div>`;
}

function renderTopLevel() {
  if (!state.uid) { mountAuth(); return; }
  if (state.view === 'profile') mountProfile();
  else if (state.view === 'settings') mountSettings();
  else mountChat();
}

function navigateTo(view) {
  if (!state.uid) return;
  state.view = view;
  state.menuOpen = false;
  renderTopLevel();
}

/* ----------------------------------------------------------------------
   Firebase live listeners
---------------------------------------------------------------------- */

function attachLiveListeners() {
  const usersRef = ref(db, 'users');
  usersUnsub = onValue(usersRef, (snap) => {
    state.usersById = snap.val() || {};
    if (awaitingFirstProfile && state.usersById[state.uid]) {
      awaitingFirstProfile = false;
      state.view = 'chat';
      renderTopLevel();
    } else if (!awaitingFirstProfile) {
      if (state.view === 'chat' && document.getElementById('message-list-inner')) renderMessageList();
      refreshTopBarAvatar();
    }
  });

  const liveQuery = query(ref(db, 'messages'), orderByChild('createdAt'), limitToLast(PAGE_SIZE));
  messagesUnsub = onValue(liveQuery, (snap) => {
    const val = snap.val() || {};
    const list = Object.entries(val).map(([id, m]) => ({ id, ...m })).sort((a, b) => a.createdAt - b.createdAt);

    const me = getProfile();
    if (hasLoadedMessagesOnce && list.length) {
      const newest = list[list.length - 1];
      if (newest.id !== lastMsgId && me && newest.uid !== me.uid) {
        if (me.soundEnabled !== false) playPing();
      }
    }
    if (list.length) lastMsgId = list[list.length - 1].id;
    hasLoadedMessagesOnce = true;

    const liveIds = new Set(list.map((m) => m.id));
    const earliestLive = list.length ? list[0].createdAt : Infinity;
    const olderKept = state.messages.filter((m) => !liveIds.has(m.id) && m.createdAt < earliestLive);
    state.messages = [...olderKept, ...list].sort((a, b) => a.createdAt - b.createdAt);
    if (list.length) {
      state.oldestLoaded = state.oldestLoaded === null ? list[0].createdAt : Math.min(state.oldestLoaded, list[0].createdAt);
    }
    if (list.length < PAGE_SIZE) state.hasMore = false;

    if (!awaitingFirstProfile && state.view === 'chat' && document.getElementById('message-list-inner')) {
      renderMessageList();
    }
  });

  const typingRef = ref(db, 'typing');
  typingUnsub = onValue(typingRef, (snap) => {
    state.typingMap = snap.val() || {};
    if (state.view === 'chat' && document.getElementById('typing-label')) updateTypingIndicatorLabel();
  });
}

function detachLiveListeners() {
  if (usersUnsub) { usersUnsub(); usersUnsub = null; }
  if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
  if (typingUnsub) { typingUnsub(); typingUnsub = null; }
}

function resetLoggedOutState() {
  state.uid = null;
  state.authEmail = null;
  state.usersById = {};
  state.messages = [];
  state.typingMap = {};
  state.oldestLoaded = null;
  state.hasMore = true;
  hasLoadedMessagesOnce = false;
  lastMsgId = null;
  state.menuOpen = false;
  state.replyingTo = null;
  state.draftText = '';
  state.reactionPickerId = null;
  state.readPopoverId = null;
  state.profileEditing = false;
  state.profileEditDraft = null;
  awaitingFirstProfile = false;
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    state.uid = user.uid;
    state.authEmail = user.email;
    awaitingFirstProfile = true;
    mountLoading();
    attachLiveListeners();
    setTimeout(() => {
      if (awaitingFirstProfile) {
        awaitingFirstProfile = false;
        detachLiveListeners();
        signOut(auth);
        state.authError = "Couldn't load your profile. Try logging in again.";
      }
    }, 8000);
  } else {
    detachLiveListeners();
    resetLoggedOutState();
    state.view = 'auth';
    mountAuth();
  }
});

/* ----------------------------------------------------------------------
   Event delegation
---------------------------------------------------------------------- */

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  switch (action) {
    case 'noop':
      break;
    case 'switch-auth-mode':
      switchAuthMode(target.dataset.mode);
      break;
    case 'toggle-password-visibility':
      togglePasswordVisibility();
      break;
    case 'reset-password':
      handleResetPassword();
      break;
    case 'show-legal':
      openLegalModal(target.dataset.kind);
      break;
    case 'close-legal':
      closeLegalModal();
      break;
    case 'nav':
      navigateTo(target.dataset.view);
      break;
    case 'toggle-account-menu':
      toggleAccountMenu();
      break;
    case 'logout':
      handleLogout();
      break;
    case 'reply': {
      const msg = state.messages.find((m) => m.id === target.dataset.id);
      if (msg) { state.replyingTo = msg; updateReplyPreview(); }
      break;
    }
    case 'cancel-reply':
      state.replyingTo = null;
      updateReplyPreview();
      break;
    case 'toggle-reaction-picker': {
      const id = target.dataset.id;
      state.reactionPickerId = state.reactionPickerId === id ? null : id;
      renderMessageList();
      break;
    }
    case 'react': {
      const msgId = target.dataset.msgId;
      const emoji = target.dataset.emoji;
      if (target.dataset.closePicker) state.reactionPickerId = null;
      handleToggleReaction(msgId, emoji);
      if (target.dataset.closePicker) renderMessageList();
      break;
    }
    case 'toggle-read-popover': {
      const id = target.dataset.id;
      state.readPopoverId = state.readPopoverId === id ? null : id;
      renderMessageList();
      break;
    }
    case 'scroll-to-message':
      scrollToMessage(target.dataset.id);
      break;
    case 'load-older':
      loadOlderMessages();
      break;
    case 'edit-profile':
      state.profileEditing = true;
      state.profileEditDraft = null;
      renderProfileContent();
      break;
    case 'cancel-edit-profile':
      state.profileEditing = false;
      state.profileEditDraft = null;
      renderProfileContent();
      break;
    case 'save-profile':
      saveProfile();
      break;
    case 'pick-avatar-color': {
      const bioEl = document.getElementById('profile-bio-input');
      if (bioEl && state.profileEditDraft) state.profileEditDraft.bio = bioEl.value;
      state.profileEditDraft.avatarColor = target.dataset.color;
      document.getElementById('profile-color-picker').innerHTML = colorPickerHtml(state.profileEditDraft.avatarColor);
      const p = getProfile();
      document.getElementById('profile-avatar-preview').innerHTML = avatarHtml(p.username, state.profileEditDraft.avatarColor, state.profileEditDraft.avatarEmoji, 84);
      break;
    }
    case 'pick-avatar-emoji': {
      const bioEl = document.getElementById('profile-bio-input');
      if (bioEl && state.profileEditDraft) state.profileEditDraft.bio = bioEl.value;
      state.profileEditDraft.avatarEmoji = target.dataset.emoji;
      document.getElementById('profile-emoji-picker').innerHTML = emojiPickerHtml(state.profileEditDraft.avatarEmoji);
      const p2 = getProfile();
      document.getElementById('profile-avatar-preview').innerHTML = avatarHtml(p2.username, state.profileEditDraft.avatarColor, state.profileEditDraft.avatarEmoji, 84);
      break;
    }
    case 'toggle-theme': {
      const p = getProfile();
      persistProfilePatch({ theme: p.theme === 'dark' ? 'light' : 'dark' }).then(() => {
        refreshRootDarkClass();
        renderSettingsContent();
      });
      break;
    }
    case 'toggle-sound': {
      const p = getProfile();
      persistProfilePatch({ soundEnabled: !(p.soundEnabled !== false) }).then(renderSettingsContent);
      break;
    }
    default:
      break;
  }
});

document.addEventListener('submit', (e) => {
  if (e.target && e.target.id === 'auth-form') {
    e.preventDefault();
    handleAuthSubmit(e.target);
  } else if (e.target && e.target.id === 'composer-form') {
    e.preventDefault();
    handleSend();
  } else if (e.target && e.target.id === 'password-form') {
    e.preventDefault();
    handlePasswordSubmit(e.target);
  }
});

document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'composer-textarea') {
    state.draftText = e.target.value;
    const sendBtn = document.getElementById('composer-send');
    if (sendBtn) sendBtn.disabled = !e.target.value.trim() || state.sending;
    handleTypingActivity();
  }
  if (e.target && e.target.id === 'profile-bio-input') {
    const counter = document.getElementById('profile-bio-counter');
    if (counter) counter.textContent = `${e.target.value.length}/160`;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target && e.target.id === 'composer-textarea' && e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
  if (e.key === 'Escape' && state.legalModalKind) closeLegalModal();
});

/* ----------------------------------------------------------------------
   Init
---------------------------------------------------------------------- */

mountLoading();
</script>
